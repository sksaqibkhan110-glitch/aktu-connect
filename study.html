<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AKTU Connect - Study Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' };</script>
  <link rel="stylesheet" href="style.css" />
  <script src="theme.js"></script>
</head>
<body class="min-h-screen pb-16 flex flex-col bg-zinc-950 text-zinc-100">

  <!-- Permanent Top Navigation Bar with all page links -->
  <nav class="bg-white dark:bg-zinc-900 border-b border-zinc-200 dark:border-zinc-800 sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 flex justify-between items-center h-16">
      
      <!-- Brand & Page Navigation Links -->
      <div class="flex items-center gap-6 sm:gap-8">
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white font-bold text-sm shadow-sm">
            AC
          </div>
          <span class="font-bold text-lg tracking-tight hidden sm:inline">AKTU Connect</span>
        </div>

        <!-- All Page Options Synchronized -->
        <div class="flex items-center gap-1 sm:gap-2">
          <a href="study.html" class="px-3 py-1.5 rounded-md text-xs sm:text-sm font-semibold bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-400 border border-indigo-200 dark:border-indigo-800/40">
            📖 Study Hub
          </a>
          <a href="pyq.html" class="px-3 py-1.5 rounded-md text-xs sm:text-sm font-medium text-zinc-600 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-100 hover:bg-zinc-100 dark:hover:bg-zinc-800 transition">
            📄 PYQs
          </a>
          <a href="quest.html" class="px-3 py-1.5 rounded-md text-xs sm:text-sm font-medium text-zinc-600 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-100 hover:bg-zinc-100 dark:hover:bg-zinc-800 transition">
            🎯 Quests
          </a>
          <a href="focus.html" class="px-3 py-1.5 rounded-md text-xs sm:text-sm font-medium text-zinc-600 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-100 hover:bg-zinc-100 dark:hover:bg-zinc-800 transition">
            ⏳ Focus
          </a>
          <a href="leaderboard.html" class="px-3 py-1.5 rounded-md text-xs sm:text-sm font-medium text-zinc-600 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-100 hover:bg-zinc-100 dark:hover:bg-zinc-800 transition">
            🏆 Leaderboard
          </a>
          <a href="chat.html" class="px-3 py-1.5 rounded-md text-xs sm:text-sm font-medium text-zinc-600 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-100 hover:bg-zinc-100 dark:hover:bg-zinc-800 transition">
            🤖 AI Tutor
          </a>
          <a href="profile.html" class="px-3 py-1.5 rounded-md text-xs sm:text-sm font-medium text-zinc-600 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-100 hover:bg-zinc-100 dark:hover:bg-zinc-800 transition">
            👤 Profile
          </a>
        </div>
      </div>

      <!-- Right Controls: Theme Toggle & Logout -->
      <div class="flex items-center gap-3">
        <button onclick="toggleGlobalTheme()" class="theme-toggle-btn ui-btn-secondary text-xs px-3 py-1.5 rounded-md">
          🌙 Dark
        </button>
        <a href="index.html" class="text-xs font-semibold text-rose-500 hover:underline">Logout</a>
      </div>

    </div>
  </nav>

  <!-- Main Content Container -->
  <main class="max-w-6xl mx-auto px-4 sm:px-6 mt-8 w-full flex-1">
    
    <!-- Page Header -->
    <div class="mb-6">
      <h1 class="text-2xl sm:text-3xl font-bold tracking-tight">Syllabus & Lecture Hub</h1>
      <p class="text-sm text-zinc-400 mt-1">Select branch and semester to load exact unit playlists and lectures.</p>
    </div>

    <!-- Branch & Semester Filters -->
    <div class="ui-card p-4 sm:p-5 mb-6 grid grid-cols-1 sm:grid-cols-2 gap-4 border border-zinc-800 bg-zinc-900/80 rounded-2xl">
      <div>
        <label class="block text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-1.5">Branch</label>
        <select id="branchSelect" onchange="onFilterChange()" class="ui-input font-medium w-full bg-zinc-950 border border-zinc-700 rounded-lg p-2.5 text-sm text-zinc-100">
          <option value="CSE_AIML">Computer Science (AI & ML)</option>
          <option value="CSE_CORE">Computer Science (Core)</option>
          <option value="CSE_AIDS">Computer Science (AI & DS)</option>
          <option value="IT">Information Technology (IT)</option>
          <option value="ECE">Electronics & Comm. (ECE)</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-1.5">Semester</label>
        <select id="semSelect" onchange="onFilterChange()" class="ui-input font-medium w-full bg-zinc-950 border border-zinc-700 rounded-lg p-2.5 text-sm text-zinc-100">
          <option value="1">Semester 1 (Group A)</option>
          <option value="2">Semester 2 (Group B)</option>
          <option value="3">Semester 3</option>
          <option value="4">Semester 4</option>
          <option value="5" selected>Semester 5</option>
          <option value="6">Semester 6</option>
          <option value="7">Semester 7</option>
          <option value="8">Semester 8</option>
        </select>
      </div>
    </div>

    <!-- Subject Tabs Selector -->
    <div id="subjectTabs" class="flex flex-wrap gap-2 mb-6 border-b border-zinc-800 pb-4"></div>

    <!-- Active Units Container -->
    <div id="unitsContainer" class="ui-card p-6 border border-zinc-800 bg-zinc-900/80 rounded-2xl"></div>

  </main>

  <script src="subjectsData.js"></script>
  <script>
    let activeSubjectId = null;

    function getSubjects(branch, sem) {
      if (sem === "1") return aktuMasterDatabase["COMMON_1"] || [];
      if (sem === "2") return aktuMasterDatabase["COMMON_2"] || [];
      return (aktuMasterDatabase[branch] && aktuMasterDatabase[branch][sem]) || aktuMasterDatabase["CSE_AIML"][sem] || [];
    }

    function onFilterChange() {
      const branch = document.getElementById("branchSelect").value;
      const sem = document.getElementById("semSelect").value;
      const subjects = getSubjects(branch, sem);

      activeSubjectId = subjects.length > 0 ? subjects[0].id : null;
      renderTabs(subjects);
      renderUnits(subjects);
    }

    function renderTabs(subjects) {
      const container = document.getElementById("subjectTabs");
      container.innerHTML = "";

      subjects.forEach(sub => {
        const isSelected = sub.id === activeSubjectId;
        const btn = document.createElement("button");
        btn.className = `px-3.5 py-1.5 rounded-lg text-xs font-semibold border transition cursor-pointer ${
          isSelected 
            ? "bg-indigo-600 text-white border-indigo-600 shadow-sm" 
            : "bg-zinc-900 text-zinc-400 border-zinc-800 hover:bg-zinc-800 hover:text-zinc-200"
        }`;
        btn.innerText = `${sub.shortName} (${sub.id})`;
        btn.onclick = () => {
          activeSubjectId = sub.id;
          renderTabs(subjects);
          renderUnits(subjects);
        };
        container.appendChild(btn);
      });
    }

    function renderUnits(subjects) {
      const container = document.getElementById("unitsContainer");
      const activeSubject = subjects.find(s => s.id === activeSubjectId);

      if (!activeSubject) {
        container.innerHTML = `<div class="text-sm text-zinc-500 py-6 text-center">No syllabus entries found.</div>`;
        return;
      }

      container.innerHTML = `
        <div class="flex items-center justify-between pb-4 mb-4 border-b border-zinc-800">
          <div>
            <span class="text-xs font-mono font-bold text-indigo-400 bg-indigo-950/60 px-2 py-0.5 rounded border border-indigo-800/40">${activeSubject.id}</span>
            <h2 class="text-xl font-bold mt-1">${activeSubject.name}</h2>
          </div>
          <span class="text-xs text-zinc-400 font-medium bg-zinc-950 border border-zinc-800 px-2.5 py-1 rounded">5 Units Syllabus</span>
        </div>

        <div class="divide-y divide-zinc-800">
          ${activeSubject.units.map(u => `
            <div class="py-3.5 flex items-center justify-between gap-4 hover:bg-zinc-800/30 px-2 rounded-md transition">
              <div class="flex items-start gap-3">
                <span class="text-xs font-mono font-bold text-zinc-500 mt-0.5">U${u.unit}</span>
                <div>
                  <div class="text-sm font-medium text-zinc-200">${u.title}</div>
                  <div class="text-[12px] text-zinc-400">AKTU Unit Lecture</div>
                </div>
              </div>
              <button onclick="window.open('https://www.youtube.com/results?search_query=${encodeURIComponent(u.query)}', '_blank')" 
                      class="px-3 py-1 text-xs font-semibold rounded bg-zinc-800 text-zinc-300 hover:bg-indigo-600 hover:text-white transition whitespace-nowrap cursor-pointer">
                Watch ↗
              </button>
            </div>
          `).join('')}
        </div>
      `;
    }

    window.addEventListener("DOMContentLoaded", onFilterChange);
  </script>
</body>
</html>
