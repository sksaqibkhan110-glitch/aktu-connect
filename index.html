<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AKTU Connect - Student Login & Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <div class="portal-card max-w-md w-full p-8 shadow-2xl relative overflow-hidden">
    <!-- Top Brand -->
    <div class="text-center mb-6">
      <div class="w-12 h-12 rounded-2xl bg-blue-600 text-amber-400 font-black text-lg flex items-center justify-center mx-auto shadow-md mb-3">
        AC
      </div>
      <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">AKTU Connect</h1>
      <p class="text-xs text-slate-500 mt-1">Student Academic & Exam Intelligence Portal</p>
    </div>

    <!-- Tab Switcher: Login / Signup -->
    <div class="flex p-1 bg-slate-100 rounded-xl mb-6">
      <button id="tab-login" onclick="switchAuthTab('login')" class="flex-1 py-2 text-xs font-bold rounded-lg bg-white text-slate-900 shadow-sm transition">Sign In</button>
      <button id="tab-signup" onclick="switchAuthTab('signup')" class="flex-1 py-2 text-xs font-bold rounded-lg text-slate-500 hover:text-slate-900 transition">Create Account</button>
    </div>

    <!-- Quick Google Login -->
    <button onclick="handleGoogleAuth()" class="w-full py-3 px-4 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 text-xs font-bold text-slate-700 flex items-center justify-center gap-2.5 transition shadow-sm mb-4 cursor-pointer">
      <svg class="w-4 h-4" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
      </svg>
      <span>Continue with Google</span>
    </button>

    <div class="flex items-center my-4">
      <div class="flex-1 border-t border-slate-200"></div>
      <span class="px-3 text-[10px] font-bold text-slate-400 uppercase">or with email</span>
      <div class="flex-1 border-t border-slate-200"></div>
    </div>

    <!-- Form -->
    <form id="auth-form" onsubmit="handleAuthSubmit(event)" class="space-y-3.5">
      <div id="name-field" class="hidden">
        <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">Full Name</label>
        <input type="text" id="auth-name" placeholder="Saqib Khan" class="w-full px-3.5 py-2.5 text-xs rounded-xl" />
      </div>

      <div>
        <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">College Email / Mobile</label>
        <input type="text" id="auth-email" required placeholder="student@aktu.ac.in or 9876543210" class="w-full px-3.5 py-2.5 text-xs rounded-xl" />
      </div>

      <div>
        <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">Password</label>
        <input type="password" id="auth-pass" required placeholder="••••••••" class="w-full px-3.5 py-2.5 text-xs rounded-xl bg-slate-50 border border-slate-200 font-semibold" />
      </div>

      <button type="submit" id="auth-btn" class="portal-btn-primary w-full py-3 text-xs mt-2 cursor-pointer">
        Sign In to Portal 🚀
      </button>
    </form>
  </div>

  <script>
    let mode = 'login';

    function switchAuthTab(type) {
      mode = type;
      const loginTab = document.getElementById('tab-login');
      const signupTab = document.getElementById('tab-signup');
      const nameField = document.getElementById('name-field');
      const authBtn = document.getElementById('auth-btn');

      if (type === 'signup') {
        signupTab.className = "flex-1 py-2 text-xs font-bold rounded-lg bg-white text-slate-900 shadow-sm transition";
        loginTab.className = "flex-1 py-2 text-xs font-bold rounded-lg text-slate-500 hover:text-slate-900 transition";
        nameField.classList.remove('hidden');
        authBtn.innerText = "Create Student Account 🎓";
      } else {
        loginTab.className = "flex-1 py-2 text-xs font-bold rounded-lg bg-white text-slate-900 shadow-sm transition";
        signupTab.className = "flex-1 py-2 text-xs font-bold rounded-lg text-slate-500 hover:text-slate-900 transition";
        nameField.classList.add('hidden');
        authBtn.innerText = "Sign In to Portal 🚀";
      }
    }

    function handleGoogleAuth() {
      localStorage.setItem('user_name', 'Saqib Khan');
      localStorage.setItem('user_college', 'GNIOT College, Greater Noida');
      localStorage.setItem('user_email', 'saqib.student@gmail.com');
      window.location.href = 'study.html';
    }

    function handleAuthSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('auth-email').value;
      const name = document.getElementById('auth-name').value || (email.split('@')[0]) || 'Student';
      
      localStorage.setItem('user_name', name);
      localStorage.setItem('user_email', email);
      window.location.href = 'study.html';
    }
  </script>
</body>
</html>
