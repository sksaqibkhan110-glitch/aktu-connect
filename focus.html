<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AKTU Connect - Focus Arena</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' };</script>
  <link rel="stylesheet" href="style.css" />
  <script src="theme.js"></script>
</head>
<body class="min-h-screen flex flex-col bg-zinc-950 text-zinc-100">

  <!-- Universal Permanent Top Navigation Bar (Fully Connected Across All Pages) -->
  <nav class="bg-white dark:bg-zinc-900 border-b border-zinc-200 dark:border-zinc-800 sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 flex justify-between items-center h-16">
      <div class="flex items-center gap-6 sm:gap-8">
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white font-bold text-sm shadow-sm">AC</div>
          <span class="font-bold text-lg tracking-tight hidden sm:inline">AKTU Connect</span>
        </div>
        <div class="flex items-center gap-1 sm:gap-2">
          <a href="study.html" class="px-3 py-1.5 rounded-md text-xs sm:text-sm font-medium text-zinc-600 dark:text-zinc-400 hover:text-zinc-900 hover:bg-zinc-100 transition">📖 Study Hub</a>
          <a href="pyq.html" class="px-3 py-1.5 rounded-md text-xs sm:text-sm font-medium text-zinc-600 dark:text-zinc-400 hover:text-zinc-900 hover:bg-zinc-100 transition">📄 PYQs</a>
          <a href="quest.html" class="px-3 py-1.5 rounded-md text-xs sm:text-sm font-medium text-zinc-600 dark:text-zinc-400 hover:text-zinc-900 hover:bg-zinc-100 transition">🎯 Quests</a>
          <a href="focus.html" class="px-3 py-1.5 rounded-md text-xs sm:text-sm font-semibold bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-400 border border-indigo-200 dark:border-indigo-800/40">⏳ Focus</a>
          <a href="leaderboard.html" class="px-3 py-1.5 rounded-md text-xs sm:text-sm font-medium text-zinc-600 dark:text-zinc-400 hover:text-zinc-900 hover:bg-zinc-100 transition">🏆 Leaderboard</a>
          <a href="chat.html" class="px-3 py-1.5 rounded-md text-xs sm:text-sm font-medium text-zinc-600 dark:text-zinc-400 hover:text-zinc-900 hover:bg-zinc-100 transition">🤖 AI Tutor</a>
          <a href="profile.html" class="px-3 py-1.5 rounded-md text-xs sm:text-sm font-medium text-zinc-600 dark:text-zinc-400 hover:text-zinc-900 hover:bg-zinc-100 transition">👤 Profile</a>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <button onclick="toggleGlobalTheme()" class="theme-toggle-btn ui-btn-secondary text-xs px-3 py-1.5 rounded-md">🌙 Dark</button>
        <a href="index.html" class="text-xs font-semibold text-rose-500 hover:underline">Logout</a>
      </div>
    </div>
  </nav>

  <!-- Main Focus Container -->
  <main class="max-w-xl mx-auto px-4 flex-1 flex flex-col justify-center items-center my-12 w-full">
    
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold tracking-tight">Focus Arena</h1>
      <p class="text-sm text-zinc-400 mt-1">Set your study session target, lock in, and earn XP towards your 9 CGPA goal upon completion.</p>
    </div>

    <!-- Timer Card -->
    <div class="ui-card w-full p-8 text-center border border-zinc-800 bg-zinc-900/60 rounded-2xl shadow-xl">
      
      <!-- Time Display -->
      <div id="timer-display" class="text-6xl sm:text-7xl font-mono font-bold tracking-wider text-indigo-400 mb-6">
        02:00:00
      </div>

      <!-- Quick Preset Buttons -->
      <div class="flex justify-center gap-2 mb-8">
        <button onclick="setTimer(30)" class="px-3 py-1.5 rounded-lg bg-zinc-800 hover:bg-zinc-700 text-xs font-semibold text-zinc-300 transition">30 Mins</button>
        <button onclick="setTimer(60)" class="px-3 py-1.5 rounded-lg bg-zinc-800 hover:bg-zinc-700 text-xs font-semibold text-zinc-300 transition">1 Hour</button>
        <button onclick="setTimer(120)" class="px-3 py-1.5 rounded-lg bg-indigo-950/60 border border-indigo-800/50 text-indigo-300 hover:bg-indigo-900/60 text-xs font-semibold transition">2 Hours 🚀</button>
      </div>

      <!-- Controls -->
      <div class="flex items-center justify-center gap-4">
        <button id="start-btn" onclick="toggleTimer()" class="px-8 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm shadow-md transition">
          Start Focus
        </button>
        <button onclick="resetTimer()" class="px-6 py-3 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-zinc-300 font-semibold text-sm transition">
          Reset
        </button>
      </div>

    </div>

  </main>

  <script>
    let totalSeconds = 7200; // Default 2 hours (120 mins)
    let remainingSeconds = totalSeconds;
    let timerInterval = null;
    let isRunning = false;

    function formatTime(secs) {
      const hrs = Math.floor(secs / 3600);
      const mins = Math.floor((secs % 3600) / 60);
      const s = secs % 60;
      return `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function updateDisplay() {
      document.getElementById('timer-display').innerText = formatTime(remainingSeconds);
    }

    function setTimer(minutes) {
      if (isRunning) return;
      totalSeconds = minutes * 60;
      remainingSeconds = totalSeconds;
      updateDisplay();
    }

    function toggleTimer() {
      const btn = document.getElementById('start-btn');
      if (!isRunning) {
        if (remainingSeconds <= 0) remainingSeconds = totalSeconds;
        isRunning = true;
        btn.innerText = "Pause Focus";
        btn.className = "px-8 py-3 rounded-xl bg-amber-600 hover:bg-amber-700 text-white font-bold text-sm shadow-md transition";
        
        timerInterval = setInterval(() => {
          if (remainingSeconds > 0) {
            remainingSeconds--;
            updateDisplay();
          } else {
            clearInterval(timerInterval);
            isRunning = false;
            btn.innerText = "Start Focus";
            btn.className = "px-8 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm shadow-md transition";
            
            // Reward XP and Update Local Storage for Profile Readiness tracker
            let currentXP = parseInt(localStorage.getItem('akt_xp') || '620');
            currentXP += 100;
            localStorage.setItem('akt_xp', currentXP);
            alert("🎉 Amazing Focus Session! You completed your study target and earned +100 XP towards your AKTU exam readiness.");
          }
        }, 1000);
      } else {
        clearInterval(timerInterval);
        isRunning = false;
        btn.innerText = "Resume Focus";
        btn.className = "px-8 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm shadow-md transition";
      }
    }

    function resetTimer() {
      clearInterval(timerInterval);
      isRunning = false;
      remainingSeconds = totalSeconds;
      updateDisplay();
      const btn = document.getElementById('start-btn');
      btn.innerText = "Start Focus";
      btn.className = "px-8 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm shadow-md transition";
    }

    updateDisplay();
  </script>
</body>
</html>
